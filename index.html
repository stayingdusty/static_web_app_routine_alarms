<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14213d"><title>Routine Beacon</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><link rel="stylesheet" href="styles.css"></head>
<body><header><nav><button id="reset" class="reset-top">Reset today</button><button data-view="dashboard">My Routines</button><button data-view="setup">Edit</button><button data-view="settings">Settings</button></nav></header>
<main><section id="run" class="view"></section><section id="dashboard" class="view hidden"></section><section id="setup" class="view hidden"></section><section id="settings" class="view hidden"></section></main>
<div id="idleDisplay" aria-label="Low-power display. Tap anywhere to return." hidden><div class="idle-glance"><time id="idleClock"></time><p id="idleRoutine"></p><small>Tap anywhere to return</small></div></div>
<div id="toast" role="status" aria-live="polite"></div><input id="importFile" type="file" accept="application/json" hidden><script type="module" src="app.js"></script></body></html>
